<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RidrameCraft Console</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='web-console.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>
        // Отключаем кэш для всех запросов
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        // Устанавливаем роль пользователя для использования в модулях
        window.userRole = "{{ session.get('role', 'guest') }}";
    </script>
</head>
<body>
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="{{ url_for('static', filename='web-console.ico') }}" style="width: 48px; height: 48px; image-rendering: pixelated;">
                <span>RidrameCraft Console</span>
            </div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>
        
        <!-- Ресурсы -->
        <div class="sidebar-section">
            <h3>📊 Ресурсы</h3>
            <div class="status-item" id="server-status">
                <h4>Статус</h4>
                <div class="value" id="status-text">Проверка...</div>
            </div>
            <div class="status-item">
                <h4>CPU</h4>
                <div class="value" id="cpu-value">-</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-progress" style="width: 0%"></div>
                </div>
            </div>
            <div class="status-item">
                <h4>RAM</h4>
                <div class="value" id="ram-value">-</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Spark данные (отображаются только если Spark доступен) -->
            <div id="spark-data-section" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #3a3a3a;">
                <div class="status-item">
                    <h4>TPS</h4>
                    <div class="value" id="tps-value">-</div>
                    <div class="value" id="tps-details" style="font-size: 0.75em; color: #999; margin-top: 3px;">-</div>
                </div>
                <div class="status-item">
                    <h4>MSPT</h4>
                    <div class="value" id="mspt-value">-</div>
                    <div class="value" id="mspt-details" style="font-size: 0.75em; color: #999; margin-top: 3px;">-</div>
                </div>
            </div>
        </div>

        <!-- Игроки -->
        <div class="sidebar-section">
            <h3>👥 Игроки <span id="players-count">(0)</span></h3>
            <div id="players-list" class="players-list">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="console-header">
            <h2>🎮 Консоль сервера</h2>
        </div>
        <div class="console-container">
            <!-- Вкладки -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('commands', this)">📝 Команды</button>
                <button class="tab" onclick="switchTab('terminal', this)">📋 Логи сервера</button>
                <button class="tab" onclick="switchTab('map', this)">🗺️ Карта</button>
                <button class="tab" onclick="switchTab('banlist', this)">🚫 Banlist / Whitelist</button>
            </div>

            <!-- Контент вкладки команд -->
            <div id="commands-tab" class="tab-content active">
                <div class="quick-commands-grid" id="main-quick-commands">
                    <!-- Команды будут добавлены через JavaScript -->
                </div>
                <div class="command-input-group">
                    <input type="text" id="command-input" placeholder="Введите команду..." autocomplete="off">
                    <button onclick="sendCommandFromInput()">Отправить</button>
                </div>
                <button class="add-command-btn" onclick="openAddCommandModal()">+ Добавить команду</button>
                <div id="console" class="console"></div>
            </div>

            <!-- Контент вкладки терминала -->
            <div id="terminal-tab" class="tab-content">
                <div class="logs-controls">
                    <div>
                        <button class="refresh-logs-btn" onclick="loadLogs()">🔄 Обновить логи</button>
                        <label class="auto-refresh-label">
                            <input type="checkbox" id="auto-refresh-logs" checked onchange="toggleAutoRefresh()">
                            Автообновление
                        </label>
                    </div>
                    <select id="logs-tail" class="logs-tail-select" onchange="loadLogs()">
                        <option value="100">Последние 100 строк</option>
                        <option value="500">Последние 500 строк</option>
                        <option value="1000">Последние 1000 строк</option>
                        <option value="2000">Последние 2000 строк</option>
                    </select>
                </div>
                <div id="logs-console" class="console"></div>
            </div>

            <!-- Контент вкладки карты -->
            <div id="map-tab" class="tab-content">
                <iframe id="map-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>

            <!-- Контент вкладки банлиста и whitelist -->
            <div id="banlist-tab" class="tab-content">
                <div style="display: flex; flex-direction: column; height: 100%; min-height: 600px;">
                    
                    <div style="display: flex; gap: 20px; flex: 1; min-height: 0;">
                        <!-- Банлист -->
                        <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                            <h3 style="color: #e0e0e0; margin: 0 0 15px 0; font-size: 1em;">🚫 Банлист</h3>
                            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                                <input type="text" id="ban-player-input" placeholder="Имя игрока" style="flex: 1; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; color: #e0e0e0;">
                                <input type="text" id="ban-reason-input" placeholder="Причина (необязательно)" style="flex: 1; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; color: #e0e0e0;">
                                <button onclick="addToBanlist()" style="padding: 10px 20px; background: #ff5555; color: white; border: 2px solid #000; border-radius: 0; cursor: pointer; font-weight: 600; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.15);">Добавить</button>
                            </div>
                            <div id="banlist-container" style="flex: 1; background: #1a1a1a; border: 2px solid #333; border-radius: 4px; padding: 15px; overflow-y: auto; min-height: 0;">
                                <div class="empty-state">
                                    <div class="empty-state-icon">⏳</div>
                                    <div>Загрузка...</div>
                                </div>
                            </div>
                        </div>

                        <!-- Разделитель -->
                        <div style="width: 1px; background: #3a3a3a;"></div>

                        <!-- Whitelist -->
                        <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                            <h3 style="color: #e0e0e0; margin: 0 0 15px 0; font-size: 1em;">✅ Белый список</h3>
                            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                                <input type="text" id="whitelist-player-input" placeholder="Имя игрока" style="flex: 1; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; color: #e0e0e0;">
                                <button onclick="addToWhitelist()" style="padding: 10px 20px; background: #3c8527; color: white; border: 2px solid #000; border-radius: 0; cursor: pointer; font-weight: 600; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.15);">Добавить</button>
                            </div>
                            <div id="whitelist-container" style="flex: 1; background: #1a1a1a; border: 2px solid #333; border-radius: 4px; padding: 15px; overflow-y: auto; min-height: 0;">
                                <div class="empty-state">
                                    <div class="empty-state-icon">⏳</div>
                                    <div>Загрузка...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Контент вкладки терминала (iframe) -->
            <div id="terminal-iframe-tab" class="tab-content">
                <iframe id="terminal-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления команды -->
    <div id="add-command-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Добавить команду</h3>
                <button class="modal-close" onclick="closeAddCommandModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-form-group">
                    <label for="modal-command-input">Команда</label>
                    <input type="text" id="modal-command-input" placeholder="Например: /say Привет" autocomplete="off">
                </div>
                <div class="modal-form-group">
                    <label for="modal-label-input">Название кнопки</label>
                    <input type="text" id="modal-label-input" placeholder="Например: Приветствие" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" onclick="closeAddCommandModal()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="addCustomCommandFromModal()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для выбора команд -->
    <div id="commands-menu-modal" class="modal-overlay">
        <div class="modal commands-menu-modal">
            <div class="modal-header">
                <h3>Выбор команды</h3>
                <button class="modal-close" onclick="closeCommandsMenu()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-form-group">
                    <input type="text" id="commands-search-input" placeholder="Поиск команды..." autocomplete="off" style="width: 100%; padding: 8px; background: #1a1a1a; border: 2px solid #333; color: white; font-size: 0.9em;">
                </div>
                <div id="commands-menu-list" class="commands-menu-list">
                    <!-- Список команд будет добавлен через JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Меню действий над игроком -->
    <div class="player-actions-menu" id="player-actions-menu"></div>

    <!-- Подключение JavaScript модулей -->
    <script>
        // Отключаем service workers если они есть
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        // Устанавливаем роль пользователя для использования в модулях
        window.userRole = "{{ session.get('role', 'guest') }}";
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/commands.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/players.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/resources.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/banlist.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/terminal.js') }}"></script>
</body>
</html>
