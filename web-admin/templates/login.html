<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - RidrameCraft Console</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='web-console.ico') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }
        .login-container {
            background: #2a2a2a;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            border: 2px solid #333;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 1.8em;
            color: #fbc811;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #000;
        }
        .login-header p {
            color: #888;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 0;
            font-size: 16px;
            color: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3c8527;
        }
        .form-group button {
            width: 100%;
            padding: 12px;
            background: #3c8527;
            color: white;
            border: 2px solid #000;
            border-radius: 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.4), inset 3px 3px 0 rgba(255,255,255,0.15);
        }
        .form-group button:hover {
            background: #4caf50;
            transform: translateY(-2px);
        }
        .form-group button:active {
            transform: translateY(1px);
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.4);
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px;">
                <img src="{{ url_for('static', filename='web-console.ico') }}" style="width: 96px; height: 96px; image-rendering: pixelated;">
                <h1 style="margin-bottom: 0;">RidrameCraft Console</h1>
            </div>
            <p>Введите пароль для доступа</p>
        </div>
        <div class="error-message" id="error-message"></div>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <div class="form-group">
                <button type="submit">Войти</button>
            </div>
            <div class="form-group" style="margin-top: 10px; text-align: center;">
                <span style="color: #666; font-size: 0.9em;">или</span>
            </div>
            <div class="form-group">
                <button type="button" onclick="loginAsGuest()" style="background: #444; border-color: #222; margin-top: 5px;">Войти как гость</button>
            </div>
        </form>
    </div>

    <script>
        function loginAsGuest() {
            const errorEl = document.getElementById('error-message');
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({guest: true})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || 'Ошибка входа';
                    errorEl.classList.add('show');
                }
            })
            .catch(() => {
                errorEl.textContent = 'Ошибка соединения';
                errorEl.classList.add('show');
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');
            
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || 'Неверный пароль';
                    errorEl.classList.add('show');
                }
            })
            .catch(() => {
                errorEl.textContent = 'Ошибка соединения';
                errorEl.classList.add('show');
            });
        }
    </script>
</body>
</html>
